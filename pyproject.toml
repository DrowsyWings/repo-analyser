[project]
name = "repo-analyze"
version = "0.1.0"
description = "Scans a repository, maps file dependencies as an interactive graph, and generates AI summaries."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.138.1",
    "google-genai>=2.10.0",
    "pydantic>=2.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.49.0",
]
